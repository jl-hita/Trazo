name: Refresh complete exercise seed

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  refresh-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download latest deployed catalog artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          test -n "$run_id" && test "$run_id" != "null"
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("exercise-catalog-"))) | .id' | head -n 1)"
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id/zip" > /tmp/exercise-catalog.zip
          mkdir -p /tmp/exercise-catalog
          unzip -q /tmp/exercise-catalog.zip -d /tmp/exercise-catalog
          test -s /tmp/exercise-catalog/exercise-catalog.json

      - name: Generate the full versioned seed
        run: |
          jq '[.exercises[] | {
            id, version: 2, source, nameEs, nameEn, descriptionEs, instructionsEs, tipsEs,
            forceType, mechanic, difficulty, equipment, bodyPart, met, isUnilateral,
            isBodyweight, movementPattern, primaryMuscles, secondaryMuscles,
            minimumExperience, suitableGoals, requiredEquipment, selectionPriority, isActive
          }]' /tmp/exercise-catalog/exercise-catalog.json > src/Trazo.Infrastructure/Seeds/exercise-catalog.json
          test "$(jq 'length' src/Trazo.Infrastructure/Seeds/exercise-catalog.json)" -eq 148
          test "$(jq '[.[] | select(.source == "repdb-free")] | length' src/Trazo.Infrastructure/Seeds/exercise-catalog.json)" -eq 100
          test "$(jq '[.[] | select(.source == "trazo-curated")] | length' src/Trazo.Infrastructure/Seeds/exercise-catalog.json)" -eq 48

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm src/Trazo.Infrastructure/Seeds/exercise-catalog-additions.json
          git add src/Trazo.Infrastructure/Seeds/exercise-catalog.json
          git commit -m "chore: seed complete current exercise library"
          git push
