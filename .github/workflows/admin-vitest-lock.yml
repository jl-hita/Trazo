name: Prepare admin Angular test dependencies

on:
  push:
    branches:
      - feat/admin-angular-testbed
    paths:
      - admin/Trazo.Admin.Web/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the reproducible npm lockfile
        working-directory: admin/Trazo.Admin.Web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- admin/Trazo.Admin.Web/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add admin/Trazo.Admin.Web/package-lock.json
            git commit -m "chore(admin): update Angular test dependencies lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
