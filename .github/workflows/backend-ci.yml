name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Trazo.sln"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Trazo.sln"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Trazo.sln
      - name: Build
        run: dotnet build Trazo.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Trazo.sln --configuration Release --no-build --logger "trx;LogFileName=trazo-tests.trx"
