name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Trazo.sln"
      - "Directory.Build.props"
      - "global.json"
      - "deploy/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Trazo.sln"
      - "Directory.Build.props"
      - "global.json"
      - "deploy/**"
      - ".github/workflows/**"

# Cancel superseded CI runs for the same PR or branch; keep unrelated work independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # La batería es casi toda de integración (un host ASP.NET por test) y va limitada por CPU:
  # se reparte en tres jobs en paralelo. El tercero es el COMPLEMENTO de los dos primeros
  # (filtro negado), así una clase nueva siempre se ejecuta en algún lado sin tocar este archivo.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: heavy-1
            filter: "Category!=Postgres&(FullyQualifiedName~ReferralApiTests|FullyQualifiedName~SubscriptionApiTests|FullyQualifiedName~AccountApiTests|FullyQualifiedName~WaitlistApiTests)"
          - shard: heavy-2
            filter: "Category!=Postgres&(FullyQualifiedName~PlansApiTests|FullyQualifiedName~FlexibleRegistrationTests|FullyQualifiedName~AdminOverviewApiTests|FullyQualifiedName~AsynchronousSplitApiTests|FullyQualifiedName~PushApiTests|FullyQualifiedName~PlansSubscriptionTests)"
          - shard: rest
            filter: "Category!=Postgres&FullyQualifiedName!~ReferralApiTests&FullyQualifiedName!~SubscriptionApiTests&FullyQualifiedName!~AccountApiTests&FullyQualifiedName!~WaitlistApiTests&FullyQualifiedName!~PlansApiTests&FullyQualifiedName!~FlexibleRegistrationTests&FullyQualifiedName!~AdminOverviewApiTests&FullyQualifiedName!~AsynchronousSplitApiTests&FullyQualifiedName!~PushApiTests&FullyQualifiedName!~PlansSubscriptionTests"
    env:
      # Sin instrumentación PGO el arranque de cada host de prueba cuesta ~25 % menos CPU.
      DOTNET_TieredPGO: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - name: Validate deployment shell scripts
        run: bash -n deploy/scripts/*.sh
      - name: Restore
        run: dotnet restore Trazo.sln
      - name: Build
        run: dotnet build Trazo.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Trazo.sln --configuration Release --no-build --filter "${{ matrix.filter }}" --logger "trx;LogFileName=trazo-tests.trx"

  # Migraciones y planificación sobre un PostgreSQL real (el resto de la batería usa SQLite): las migraciones
  # de aprendizaje y la reorganización por frecuencia con las migraciones reales.
  postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_TieredPGO: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      TRAZO_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Trazo.sln
      - name: Build
        run: dotnet build Trazo.sln --configuration Release --no-restore
      - name: Test
        run: |
          dotnet test Trazo.sln --configuration Release --no-build --filter "Category=Postgres" --logger "trx;LogFileName=trazo-postgres.trx" | tee postgres-test.log
          # The PostgreSQL scenarios must really run here: a skipped or empty run is a failure, not a pass.
          grep -Eq "Passed!.*Failed: +0, Passed: +[1-9][0-9]*, Skipped: +0," postgres-test.log

  # Un único check estable para el resto del repositorio: falla si cualquier reparto falla o se cancela.
  build-and-test:
    if: always()
    needs: [test, postgres]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = "success" && test "${{ needs.postgres.result }}" = "success"
