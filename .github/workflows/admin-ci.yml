name: Admin Web CI

on:
  push:
    branches: [main]
    paths:
      - "admin/Trazo.Admin.Web/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    paths:
      - "admin/Trazo.Admin.Web/**"
      - ".github/workflows/admin-ci.yml"

# Cancel superseded CI runs for the same PR or branch; keep unrelated work independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/Trazo.Admin.Web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
