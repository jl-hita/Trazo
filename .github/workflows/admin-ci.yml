name: Admin Web CI

on:
  push:
    branches: [main]
    paths:
      - "admin/Trazo.Admin.Web/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    paths:
      - "admin/Trazo.Admin.Web/**"
      - ".github/workflows/admin-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/Trazo.Admin.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
