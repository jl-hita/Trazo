name: Admin Web CI

on:
  push:
    branches: [main]
    paths:
      - "admin/Trazo.Admin.Web/**"
      - ".github/workflows/admin-ci.yml"
  # No path filter: these checks are required on main, so every pull request must report them.
  pull_request:

# Cancel superseded CI runs for the same PR or branch; keep unrelated work independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/Trazo.Admin.Web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Angular coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-angular-coverage
          path: admin/Trazo.Admin.Web/coverage
          if-no-files-found: warn
          retention-days: 14
