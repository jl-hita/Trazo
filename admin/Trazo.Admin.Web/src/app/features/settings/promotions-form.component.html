    <form class="pr" (ngSubmit)="save()" autocomplete="off">
      <fieldset>
        <legend>{{ labels.title }}</legend>
        <label class="check">
          <input type="checkbox" name="trialOn" [ngModel]="trialEnabled()" (ngModelChange)="trialEnabled.set($event)" [disabled]="busy()">
          {{ labels.welcomeEnabled }}
        </label>
        <trazo-form-field [label]="labels.welcomePeriod" controlId="trialDays"><input type="number" name="trialDays" min="1" [max]="maxDays()" [ngModel]="trialDays()" (ngModelChange)="trialDays.set(+$event)" [disabled]="busy()" id="trialDays">
        </trazo-form-field>
        <p class="hint">{{ labels.welcomeExplanation }}</p>
        <label class="check">
          <input type="checkbox" name="refOn" [ngModel]="referralsEnabled()" (ngModelChange)="referralsEnabled.set($event)" [disabled]="busy()">
          {{ labels.referralEnabled }}
        </label>
        <trazo-form-field [label]="labels.referralReward" controlId="refDays"><input type="number" name="refDays" min="1" [max]="maxDays()" [ngModel]="rewardDays()" (ngModelChange)="rewardDays.set(+$event)" [disabled]="busy()" id="refDays">
        </trazo-form-field>
        <p class="hint">{{ labels.referralOff }}</p>
        <div class="actions">
          <trazo-button variant="secondary" type="submit" [disabled]="busy()">{{ labels.save }}</trazo-button>
          @if (message()) { <span class="ok" role="status">{{ message() }}</span> }
          @if (error()) { <span class="err" role="alert">{{ error() }}</span> }
        </div>
      </fieldset>
    </form>
