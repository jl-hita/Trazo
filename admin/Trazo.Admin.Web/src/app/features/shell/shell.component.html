<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="TRAZO administration home">
      <img class="brand-logo" src="logo-dark.svg" alt="TRAZO" height="34">
      <small>ADMINISTRATION</small>
    </a>
    <div class="workspace-label">WORKSPACE</div>
    <nav aria-label="Main navigation">
      @for (item of navigation; track item.label) {
        <a class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [routerLink]="item.link ?? null" [class.disabled]="!item.link">
          <span class="nav-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="sidebar-footer">
      <span class="status-dot"></span><span>System workspace</span><span class="environment">DEV</span>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <span class="breadcrumb">Workspace</span>
      <div class="admin-chip"><span class="avatar">{{ initial() }}</span> {{ auth.user()?.displayName }} <button class="link" type="button" (click)="logout()">Sign out</button></div>
    </header>
    <section class="content"><router-outlet /></section>
  </main>
</div>
