    <section>
      <img src="logo-dark.svg" alt="TRAZO">
      <h1>{{ title() }}</h1>
      <p role="status">{{ message() }}</p>
      @if (phase() === 'ready' || phase() === 'working') {
        <button type="button" (click)="run()" [disabled]="phase() === 'working'">{{ phase() === 'working' ? t.wait : t[action].button }}</button>
      } @else {
        <a href="/">{{ t.home }}</a>
      }
    </section>
