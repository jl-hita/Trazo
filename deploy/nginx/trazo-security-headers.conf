# /etc/nginx/snippets/trazo-security-headers.conf
#
# Cabeceras de seguridad de la web de TRAZO (landing y consola de administración). Se incluye desde trazo-site.conf.
# HSTS solo tiene efecto por HTTPS; los navegadores lo ignoran en HTTP.
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Angular inserta los estilos de cada componente en etiquetas <style>: por eso style-src admite 'unsafe-inline'.
# Los scripts solo pueden venir del propio sitio; no hay ninguno en línea (ver "inlineCritical" en angular.json).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
