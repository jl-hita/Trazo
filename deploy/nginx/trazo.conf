# /etc/nginx/conf.d/trazo.conf
#
# Estado inicial: solo HTTP en el puerto 80, suficiente para que certbot valide el dominio. Después ejecuta:
#   sudo certbot --nginx -d trazostrength.duckdns.org
# Certbot añadirá a este archivo el TLS y la redirección a HTTPS.
#
# Aquí solo va lo que depende del servidor; el sitio está en snippets/trazo-site.conf. Instálalo y actualízalo con
#   sudo bash deploy/scripts/install-trazo-nginx.sh
# que conserva las líneas de certbot.

server {
    listen 80;
    listen [::]:80;
    server_name trazostrength.duckdns.org;

    include snippets/trazo-site.conf;
}
