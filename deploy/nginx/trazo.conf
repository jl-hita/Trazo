# /etc/nginx/conf.d/trazo.conf
#
# Estado inicial: solo HTTP en el puerto 80, suficiente para que certbot valide
# el dominio. Después ejecuta:
#   sudo certbot --nginx -d trazostrength.duckdns.org
# Certbot añadirá el bloque 443 y la redirección a HTTPS.
#
# El frontend Angular se sirve desde /var/www/trazo (enlace a la release activa);
# /api y /health van al API en loopback. DietoExpress conserva su propio
# server_name; este archivo no lo toca.
#
# IMPORTANTE: una vez ejecutado certbot este archivo contiene cambios suyos.
# No lo vuelvas a copiar encima; edítalo en /etc/nginx/conf.d/trazo.conf.

server {
    listen 80;
    listen [::]:80;
    server_name trazostrength.duckdns.org;

    root /var/www/trazo;
    index index.html;

    # El importador privado envía un ZIP (la API admite hasta 512 MB, ver Program.cs).
    client_max_body_size 512m;

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Solo los js/css/fuentes con hash son inmutables; logos e iconos (sin hash) y index.html no.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Borrado de cuenta (URL publica para Google Play): lo sirve el API, no Angular. Ver docs/account-deletion.md.
    location ^~ /account/delete {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
