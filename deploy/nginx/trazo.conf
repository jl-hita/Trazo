# /etc/nginx/conf.d/trazo.conf
#
# Estado inicial: solo HTTP en el puerto 80, suficiente para que certbot valide
# el dominio. Después ejecuta:
#   sudo certbot --nginx -d trazo.duckdns.org
# Certbot añadirá el bloque 443 y la redirección a HTTPS.
#
# DietoExpress conserva su propio server_name; este archivo no lo toca.

server {
    listen 80;
    listen [::]:80;
    server_name trazo.duckdns.org;

    # El importador privado envía un ZIP (la API admite hasta 512 MB, ver Program.cs).
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
