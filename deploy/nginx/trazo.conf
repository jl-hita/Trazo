# /etc/nginx/conf.d/trazo.conf
#
# Estado inicial: solo HTTP en el puerto 80, suficiente para que certbot valide
# el dominio. Después ejecuta:
#   sudo certbot --nginx -d trazostrength.duckdns.org
# Certbot añadirá el bloque 443 y la redirección a HTTPS.
#
# El frontend Angular se sirve desde /var/www/trazo (enlace a la release activa);
# /api y /health van al API en loopback. DietoExpress conserva su propio
# server_name; este archivo no lo toca.
#
# IMPORTANTE: una vez ejecutado certbot este archivo contiene cambios suyos.
# No lo vuelvas a copiar encima; edítalo en /etc/nginx/conf.d/trazo.conf.
#
# Requiere /etc/nginx/snippets/trazo-security-headers.conf (copia de deploy/nginx/trazo-security-headers.conf).
# En el servidor ya desplegado, las directivas de este archivo van dentro del bloque "listen 443 ssl" que creó certbot.

server {
    listen 80;
    listen [::]:80;
    server_name trazostrength.duckdns.org;

    root /var/www/trazo;
    index index.html;
    server_tokens off;

    # Lo mayor que acepta la API con normalidad es una imagen de ejercicio (1 MB). El importador privado tiene su
    # propio límite más abajo: con 512 MB para todo el servidor, cualquiera podía llenar el disco con cuerpos grandes.
    client_max_body_size 2m;

    # Cabeceras de seguridad de la web (Angular). nginx NO hereda add_header en un location que declare los suyos:
    # por eso se repite el include en cada location con add_header. El API añade las suyas (ver Program.cs).
    include /etc/nginx/snippets/trazo-security-headers.conf;

    # Importador privado de DietoExpress: único punto que admite un ZIP grande (hasta 512 MB, ver Program.cs).
    # Si DietoExpress llama siempre desde esta misma máquina, descomenta las dos líneas para cerrarlo al exterior.
    location = /api/internal/exercise-catalog/import {
        client_max_body_size 512m;
        # allow 127.0.0.1;
        # deny all;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Notificaciones de Google Play: si se usa el secreto en la URL (?secret=...), no debe quedar en el log de accesos.
    location = /api/v1/subscription/notifications {
        access_log off;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Solo los js/css/fuentes con hash son inmutables; logos e iconos (sin hash) y index.html no.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/trazo-security-headers.conf;
        try_files $uri =404;
    }

    # Borrado de cuenta (URL publica para Google Play): lo sirve el API, no Angular. Ver docs/account-deletion.md.
    location ^~ /account/delete {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/trazo-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
