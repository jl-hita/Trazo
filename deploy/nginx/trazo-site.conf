# /etc/nginx/snippets/trazo-site.conf
#
# Todo lo que sirve el sitio de TRAZO. Lo incluye el bloque "server" de /etc/nginx/conf.d/trazo.conf, que es lo único
# que certbot modifica. No edites la copia del servidor: cambia este archivo y ejecuta
#   sudo bash deploy/scripts/install-trazo-nginx.sh
#
# El frontend Angular se sirve desde /var/www/trazo (enlace a la release activa). Todo lo que genera la API necesita
# aquí su "location": si falta, el "try_files" de Angular se lo traga y responde 200 con la web.
# DietoExpress conserva su propio server_name; este archivo no lo toca.

root /var/www/trazo;
index index.html;
server_tokens off;

# Lo mayor que acepta la API con normalidad es una imagen de ejercicio (1 MB). Las dos subidas grandes tienen su propio
# límite más abajo: con uno alto para todo el servidor, cualquiera podría llenar el disco con cuerpos enormes.
client_max_body_size 2m;

# Importador privado de DietoExpress: ZIP de hasta 512 MB (ver Program.cs).
# Si DietoExpress llama siempre desde esta misma máquina, descomenta las dos líneas para cerrarlo al exterior.
location = /api/internal/exercise-catalog/import {
    client_max_body_size 512m;
    # allow 127.0.0.1;
    # deny all;
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# Mapping R8 que sube la publicación de Android (hasta 64 MB, ver R8MappingStore.MaxUploadBytes).
location = /api/internal/diagnostics/mappings {
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Notificaciones de Google Play: si se usa el secreto en la URL (?secret=...), no debe quedar en el log de accesos.
location = /api/v1/subscription/notifications {
    access_log off;
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /health {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Páginas públicas que genera la API fuera de /api. Ponen sus propias cabeceras de seguridad.

# Borrado de cuenta: URL pública que exige Google Play. Ver docs/account-deletion.md.
location ^~ /account/delete {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Invitaciones del programa de referidos. Ver docs/referrals.md.
location ^~ /invite/ {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Enlaces de campaña. Ver docs/marketing.md.
location ^~ /c/ {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Android App Links. Responde 404 mientras no se configure AppLinks__Sha256Fingerprints.
location = /.well-known/assetlinks.json {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# A partir de aquí, la web. Sus cabeceras de seguridad se incluyen en cada location: nginx no hereda add_header en un
# location que declare los suyos, y puestas a nivel de servidor se sumarían a las de la API.

# Solo los js/css/fuentes con hash son inmutables; logos e iconos (sin hash) y index.html no.
location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include snippets/trazo-security-headers.conf;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache";
    include snippets/trazo-security-headers.conf;
    try_files $uri $uri/ /index.html;
}
